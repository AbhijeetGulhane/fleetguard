version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose            # unclosed HTTP response bodies (controller scrapes agents)
    - errorlint            # wrapped-error comparisons done with == instead of errors.Is
    - misspell
    - noctx                # HTTP requests without a context (no timeouts/cancellation)
    - revive               # style: exported names, package comments
    - unconvert            # redundant type conversions

formatters:
  enable:
    - gofmt
    - goimports
